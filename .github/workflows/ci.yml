name: CI

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "Available tvOS SDKs:"
          xcodebuild -showsdks | grep -i tvos || true

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenIPTV.xcodeproj \
            -scheme OpenIPTV

      - name: Build (tvOS simulator)
        run: |
          xcodebuild build \
            -project OpenIPTV.xcodeproj \
            -scheme OpenIPTV \
            -destination 'generic/platform=tvOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
